name: Bindings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs below read the tree, build it and run tests; none of them write to
# the repository. Without this block GITHUB_TOKEN is minted with whatever the
# repository default happens to be, which for older repositories is read/write
# - handed to third-party actions and to build scripts from a pull request's
# own head.
permissions:
  contents: read

# A new push to a pull request supersedes the one before it. Without this,
# three pushes leave three full matrices running, each filling its own
# rust-cache entry against the 10 GB per-repository allowance.
#
# The event is part of the key, and only pull requests cancel. Without both,
# a push to main would land in the same group as a manual run on main and kill
# the long macOS/Windows matrix that is the only reason to dispatch this
# workflow - and cancelled main builds lose the per-commit attribution that
# makes a break easy to place.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Each binding wraps the same native library, so every job builds it first.
# Like the Rust suites, these skip corpus-dependent tests when testdata/ is
# absent, which it is in CI.

jobs:
  python:
    name: python (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A standalone crate root with its own Cargo.lock, so the build below
          # writes to bindings/python/target rather than the root's. Left at the
          # default only the registry is cached and the native library is
          # recompiled from scratch every run.
          workspaces: "bindings/python -> target"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and test
        working-directory: bindings/python
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet 'maturin>=1.14,<2' pytest
          .venv/bin/maturin develop --release
          .venv/bin/python -m pytest -q

  nodejs:
    name: node.js (napi-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A standalone crate root with its own Cargo.lock, so the build below
          # writes to bindings/nodejs/target rather than the root's. Left at the
          # default only the registry is cached and the native library is
          # recompiled from scratch every run.
          workspaces: "bindings/nodejs -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build and test
        working-directory: bindings/nodejs
        run: |
          npm ci
          npm run build
          npm test

  csharp:
    name: c# (net8.0, net10.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The test project copies the native library out of target/release, so
      # it has to exist before dotnet test runs.
      - name: Build native library
        run: cargo build --release --all-features
      - name: Test
        working-directory: bindings/csharp
        run: dotnet test tests/SiftX.Tests/SiftX.Tests.csproj

  java:
    name: java (Panama FFM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build native library
        run: cargo build --release --all-features
      # Deliberately no SIFTX_NATIVE_LIB_PATH: the POM stages the library cargo
      # just built into the JAR, and Native.java extracts it at runtime. This
      # is the path a Maven consumer takes, so it is the one worth testing.
      - name: Test
        working-directory: bindings/java
        run: mvn -B test
